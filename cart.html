<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — SYNKD Streetwear</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-fade">

<header class="site-header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8l4 4 5-8 5 8 4-4-2 10H5L3 8z"/>
    </svg>
    SYNKD
  </a>
  <div class="header-actions">
    <a href="cart.html" class="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count">0</span>
    </a>
    <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="drawer-overlay"></div>
<nav class="drawer">
  <button class="drawer-close" aria-label="Close menu">✕</button>
  <ul class="drawer-nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop All</a></li>
    <li><a href="shop.html?cat=tshirts">T-Shirts</a></li>
    <li><a href="shop.html?cat=shorts">Shorts</a></li>
    <li><a href="shop.html?cat=alo">Alo</a></li>
    <li><a href="cart.html" class="active">Cart</a></li>
    <li><a href="policies.html">Policies</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="drawer-contact">
    <strong>@synkd.streetwear</strong><br/>
    WhatsApp 551 312-8280
  </div>
</nav>

<div class="section-head" style="padding-bottom:0;">
  <div>
    <div class="meta"><span>YOUR</span></div>
    <h2>CART</h2>
  </div>
</div>

<div class="cart-wrap" id="cart-wrap"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function renderCart() {
    const wrap = document.getElementById("cart-wrap");
    const cart = getCart();

    if (cart.length === 0) {
      wrap.innerHTML = `
        <div class="empty-state">
          <h3>Your cart is empty</h3>
          <p>Add something from the shop first.</p>
          <br/>
          <a href="shop.html" class="btn btn-primary">Go to shop</a>
        </div>`;
      return;
    }

    let itemsHtml = "";
    cart.forEach(item => {
      itemsHtml += `
        <div class="cart-item">
          <div class="cart-thumb">${item.image ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">` : ""}</div>
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <span>$${item.price} USD</span>
            <div class="qty-control" style="margin-top:8px;">
              <button data-action="dec" data-id="${item.id}">−</button>
              <span>${item.qty}</span>
              <button data-action="inc" data-id="${item.id}">+</button>
            </div>
            <a class="remove-btn" data-action="remove" data-id="${item.id}">Remove</a>
          </div>
          <div style="font-weight:700;">$${(item.price * item.qty).toFixed(2)}</div>
        </div>`;
    });

    const total = cartTotal();

    wrap.innerHTML = `
      ${itemsHtml}
      <div class="cart-summary">
        <div class="cart-summary-row"><span>Subtotal</span><span>$${total.toFixed(2)} USD</span></div>
        <div class="cart-summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
        <div class="cart-summary-row total"><span>Total</span><span>$${total.toFixed(2)} USD</span></div>
        <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:16px;">Checkout</a>
        <a href="shop.html" class="btn btn-outline btn-full">Continue shopping</a>
      </div>`;

    wrap.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const item = getCart().find(i => i.id === id);
        if (btn.dataset.action === "inc") updateQty(id, item.qty + 1);
        if (btn.dataset.action === "dec") updateQty(id, item.qty - 1);
        if (btn.dataset.action === "remove") removeFromCart(id);
        renderCart();
      });
    });
  }

  renderCart();
</script>
</body>
</html>
