<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — SYNKD Streetwear</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-fade">

<header class="site-header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8l4 4 5-8 5 8 4-4-2 10H5L3 8z"/>
    </svg>
    SYNKD
  </a>
  <div class="header-actions">
    <a href="cart.html" class="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count">0</span>
    </a>
    <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="drawer-overlay"></div>
<nav class="drawer">
  <button class="drawer-close" aria-label="Close menu">✕</button>
  <ul class="drawer-nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop All</a></li>
    <li><a href="shop.html?cat=tshirts">T-Shirts</a></li>
    <li><a href="shop.html?cat=shorts">Shorts</a></li>
    <li><a href="shop.html?cat=alo">Alo</a></li>
    <li><a href="cart.html">Cart</a></li>
    <li><a href="policies.html">Policies</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="drawer-contact">
    <strong>@synkd.streetwear</strong><br/>
    WhatsApp 551 312-8280
  </div>
</nav>

<div class="section-head" style="padding-bottom:0;">
  <div>
    <div class="meta"><span>SECURE</span></div>
    <h2>CHECKOUT</h2>
  </div>
</div>

<div class="checkout-wrap">
  <div id="order-summary"></div>

  <form id="checkout-form" style="margin-top:26px;">
    <div class="form-row">
      <div class="form-group">
        <label for="fname">First name</label>
        <input id="fname" required />
      </div>
      <div class="form-group">
        <label for="lname">Last name</label>
        <input id="lname" required />
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" required />
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" required />
    </div>
    <div class="form-group">
      <label for="address">Shipping address</label>
      <input id="address" required />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="city">City</label>
        <input id="city" required />
      </div>
      <div class="form-group">
        <label for="state">State</label>
        <input id="state" required />
      </div>
    </div>
    <div class="form-group">
      <label for="zip">ZIP code</label>
      <input id="zip" required />
    </div>

    <button type="submit" class="btn btn-primary btn-full" id="pay-btn">Pay now</button>
    <p class="small-note">
      Card payment via Stripe is being connected. For now, submitting sends your order
      and address straight to SYNKD on WhatsApp to confirm payment.
    </p>
  </form>
</div>

<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  const STORE_WHATSAPP = "15513128280"; // sin espacios ni +, formato internacional

  function renderSummary() {
    const cart = getCart();
    const box = document.getElementById("order-summary");
    if (cart.length === 0) {
      box.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><a href="shop.html" class="btn btn-primary">Go to shop</a></div>`;
      document.getElementById("checkout-form").style.display = "none";
      return;
    }
    let html = cart.map(i => `<div class="order-line"><span>${i.qty} × ${i.name}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join("");
    html += `<div class="order-line" style="color:var(--text);font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;"><span>Total</span><span>$${cartTotal().toFixed(2)} USD</span></div>`;
    box.innerHTML = html;
  }

  document.getElementById("checkout-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const cart = getCart();
    if (cart.length === 0) return;

    const data = {
      fname: document.getElementById("fname").value,
      lname: document.getElementById("lname").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      city: document.getElementById("city").value,
      state: document.getElementById("state").value,
      zip: document.getElementById("zip").value,
    };

    const itemsText = cart.map(i => `- ${i.qty}x ${i.name} ($${i.price} each)`).join("%0A");
    const message =
      `New order from SYNKD site%0A%0A` +
      `Customer: ${data.fname} ${data.lname}%0A` +
      `Email: ${data.email}%0A` +
      `Phone: ${data.phone}%0A` +
      `Shipping to: ${data.address}, ${data.city}, ${data.state} ${data.zip}%0A%0A` +
      `Items:%0A${itemsText}%0A%0A` +
      `Total: $${cartTotal().toFixed(2)} USD`;

    window.open(`https://wa.me/${STORE_WHATSAPP}?text=${message}`, "_blank");
    clearCart();
    document.querySelector(".checkout-wrap").innerHTML = `
      <div class="empty-state">
        <h3>Order sent ✓</h3>
        <p>We opened WhatsApp with your order details. Confirm payment there to finish.</p>
        <br/>
        <a href="index.html" class="btn btn-primary">Back to home</a>
      </div>`;
  });

  renderSummary();
</script>
</body>
</html>
