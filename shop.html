<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — SYNKD Streetwear</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-fade">

<header class="site-header">
  <a href="index.html" class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8l4 4 5-8 5 8 4-4-2 10H5L3 8z"/>
    </svg>
    SYNKD
  </a>
  <div class="header-actions">
    <a href="cart.html" class="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count">0</span>
    </a>
    <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="drawer-overlay"></div>
<nav class="drawer">
  <button class="drawer-close" aria-label="Close menu">✕</button>
  <ul class="drawer-nav">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html" class="active">Shop All</a></li>
    <li><a href="shop.html?cat=tshirts">T-Shirts</a></li>
    <li><a href="shop.html?cat=shorts">Shorts</a></li>
    <li><a href="shop.html?cat=alo">Alo</a></li>
    <li><a href="cart.html">Cart</a></li>
    <li><a href="policies.html">Policies</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="drawer-contact">
    <strong>@synkd.streetwear</strong><br/>
    WhatsApp 551 312-8280
  </div>
</nav>

<div class="section-head">
  <div>
    <div class="meta"><span>2026</span><span>SEPTEMBER</span></div>
    <h2 id="shop-title">SHOP</h2>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab" data-cat="all">All</button>
  <button class="tab" data-cat="tshirts">T-Shirts</button>
  <button class="tab" data-cat="shorts">Shorts</button>
  <button class="tab" data-cat="alo">Alo</button>
</div>

<div class="grid" id="product-grid"></div>

<footer class="footer-panel">
  <div class="handle">@SYNKD.<br/>STREETWEAR</div>
  <p>You are just one step away from holding the product you've always dreamed of in your hands.</p>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  const grid = document.getElementById("product-grid");
  const tabs = document.querySelectorAll(".tab");
  const titleEl = document.getElementById("shop-title");

  function renderProducts(category) {
    const items = category === "all" ? PRODUCTS : PRODUCTS.filter(p => p.category === category);
    grid.innerHTML = "";
    items.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (i * 0.04) + "s";
      card.innerHTML = `
        <div class="card-media">
          ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<span class="placeholder">PHOTO COMING SOON</span>`}
        </div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <p class="card-price">$${p.price} USD</p>
          <div class="card-foot">
            <button class="add-btn" data-id="${p.id}">Add to cart</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });

    grid.querySelectorAll(".add-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const product = PRODUCTS.find(p => p.id === btn.dataset.id);
        addToCart(product, 1);
        btn.textContent = "Added ✓";
        btn.classList.add("added");
        setTimeout(() => { btn.textContent = "Add to cart"; btn.classList.remove("added"); }, 1200);
      });
    });
  }

  function setActiveTab(cat) {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.cat === cat));
    titleEl.textContent = cat === "all" ? "SHOP" : CATEGORY_LABELS[cat].toUpperCase();
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      const cat = tab.dataset.cat;
      history.replaceState(null, "", cat === "all" ? "shop.html" : `shop.html?cat=${cat}`);
      setActiveTab(cat);
      renderProducts(cat);
    });
  });

  const params = new URLSearchParams(window.location.search);
  const initialCat = params.get("cat") && CATEGORY_LABELS[params.get("cat")] ? params.get("cat") : "all";
  setActiveTab(initialCat);
  renderProducts(initialCat);
</script>
</body>
</html>
